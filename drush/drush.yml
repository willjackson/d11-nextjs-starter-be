# Project drush configuration.
#
# Drupal runs as its own DDEV project (d11-nextjs-be) served at its primary URL, so point
# drush at that hostname for correct absolute URLs (e.g. one-time login links). On
# Pantheon the platform sets the correct URI, so this local default is harmless there.
options:
  uri: 'https://d11-nextjs-be.ddev.site'
